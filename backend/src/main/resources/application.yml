server:
  port: 8080

spring:
  application:
    name: petstore-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/petstore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  global-config:
    banner: false

jwt:
  # 签名密钥（HS256 要求至少 32 字节）；生产部署请通过环境变量 JWT_SECRET 覆盖
  secret: petstore-secret-key-for-hs256-please-change-in-production-2026
  expire-hours: 24
